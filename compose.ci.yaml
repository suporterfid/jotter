# Overrides for `jt ci` (and any run with JOTTER_CI=1 or CI=true). Nothing is
# published on the host, so a CI run can coexist with a running dev stack;
# Playwright reaches the app through the internal `jotter-web` alias.
services:
  app:
    ports: !override []

  mysql:
    ports: !override []

  node:
    environment:
      CI: "true"

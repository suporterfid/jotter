<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Jotter is offline</title>
    <style>
      :root {
        color-scheme: light;
        background: #FFFFFF;
        color: #252525;
        font-family: Arial, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          background: #191919;
          color: #F1F1EF;
        }
      }

      body {
        align-items: center;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 1.5rem;
        text-align: center;
      }

      main {
        max-width: 32rem;
      }

      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jotter is offline</h1>
      <p>The app shell is unavailable right now. Reconnect and try again.</p>
      <p><a href="/">Try again</a></p>
    </main>
  </body>
</html>

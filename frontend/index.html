<!doctype html>
<html lang="en">
  <!-- Dev-server HTML Shell. Keep synchronized with resources/views/app.blade.php (production shell). -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      (function () {
        var stored = localStorage.getItem('jotter-theme');
        var preference = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
        var theme = preference === 'light' || preference === 'dark'
          ? preference
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', theme === 'dark' ? '#191919' : '#FFFFFF');
      })();
    </script>
    <meta name="description" content="A fast, local-first Markdown knowledge base and note-taking application." />

    <title>Jotter</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:title" content="Jotter" />
    <meta property="og:description" content="A fast, local-first Markdown knowledge base and note-taking application." />
    <meta property="og:image" content="/social-card.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app-right-drawer-primary"></div>
    <div id="app-right-drawer-secondary"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      JOTTER_CI: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap and start containers
        run: ./scripts/jt.sh up

      - name: Run Laravel and frontend tests
        run: ./scripts/jt.sh test

      - name: Run Playwright smoke test
        run: ./scripts/jt.sh e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7

      - name: Dump Laravel log on failure
        if: failure()
        run: |
          echo "--- storage/logs/laravel.log ---"
          cat storage/logs/laravel.log || echo "(no laravel.log)"
          echo "--- docker compose logs app (tail) ---"
          docker compose -f compose.yaml -f compose.ci.yaml logs --tail=200 app || true

      - name: Build shared-hosting release
        run: ./scripts/jt.sh release

      - name: Verify release artifact for secrets
        run: ./scripts/jt.sh release:verify

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: jotter-release
          path: |
            dist/jotter-release-*.zip
            dist/jotter-release-*.zip.sha256

      - name: Stop containers
        if: always()
        run: ./scripts/jt.sh down --volumes
